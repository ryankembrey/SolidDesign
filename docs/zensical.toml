#
# Site configuration for the Solid Design documentation (Zensical).
# Build: `pixi run docs` from the repository root. See docs/README.md.
#
# The nav is written by hand, except the blocks between "BEGIN GENERATED" and
# "END GENERATED" markers: docs/build.py rewrites those. Edit around them.

[project]
site_name = "Solid Design"
site_description = "Model parts in FreeCAD the SolidWorks way, multi-body from the start: how to use the Solid Design workbench, and every tool in it."
site_url = "https://ryankembrey.github.io/SolidDesign/"
repo_url = "https://github.com/ryankembrey/SolidDesign"
repo_name = "SolidDesign"
copyright = "Solid Design by Ryan Kembrey, LGPL-2.1-or-later. This site is generated from the latest main branch."
docs_dir = "content"
site_dir = "build/site"
extra_css = ["stylesheets/extra.css"]

